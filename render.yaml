services:
  - type: web
    name: reafirechat-backend
    runtime: python
    buildCommand: "pip install -r backend/requirements.txt"
    startCommand: "cd backend && gunicorn -w 2 -b 0.0.0.0:8000 -k uvicorn.workers.UvicornWorker main:app"
    envVars:
      - key: DATABASE_URL
        scope: backend
        fromDatabase:
          name: reafirechat-db
          property: connectionString
      - key: ALLOWED_ORIGINS
        value: "https://reafirechat.onrender.com,https://reafirechat-frontend.onrender.com"
      - key: PYTHON_VERSION
        value: "3.11"

  - type: web
    name: reafirechat-frontend
    runtime: node
    buildCommand: "npm install && npm run build"
    startCommand: "npx serve -s build -l 3000"
    envVars:
      - key: REACT_APP_API_BASE
        value: "https://reafirechat-backend.onrender.com"
    routes:
      - path: "/*"
        destination: "/index.html"

databases:
  - name: reafirechat-db
    databaseName: reafirechat
    user: reafirechat
    plan: free
